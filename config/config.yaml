client:
  server_url: "http://localhost:5000"
  auth_token: "your-secret-token"
  collection_interval: 30
  monitored_paths:
    - /etc/passwd
    - /etc/shadow
    - /etc/ssh/sshd_config
  monitored_logs:
    - /var/log/syslog
    - /var/log/auth.log

server:
  host: "0.0.0.0"
  port: 5000
  database: "ahids.db"
  secret_key: "your-secret-key"

dashboard:
  host: "0.0.0.0"
  port: 8080

alerts:
  email_enabled: false
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  email_from: ""
  email_to: ""
  email_password: ""

ai:
  model_path: "models/"
  anomaly_threshold: 0.7
  retrain_interval: 86400
